services:
  wiki:
    build: .
    image: nightingzine/dipcr-wiki:latest
    container_name: dipcr-wiki
    restart: unless-stopped
    ports:
      # HOST:CONTAINER — change only the LEFT side to avoid conflicts.
      - "5010:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Mounted so pages, screenshots and CSS can be updated without rebuilding the image.
      - ./pages:/app/pages
      - ./static:/app/static
